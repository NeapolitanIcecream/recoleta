name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tagged version to publish, without the v prefix
        required: true
        type: string
      update_latest:
        description: Update latest; accepted only for a stable X.Y.Z version
        required: true
        default: false
        type: boolean

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Verify the release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REQUESTED_VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(uv version --short)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            EXPECTED_TAG="${RELEASE_TAG}"
          else
            EXPECTED_TAG="v${REQUESTED_VERSION}"
          fi
          if [[ "${EXPECTED_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Expected ${EXPECTED_TAG} to match package version v${PACKAGE_VERSION}" >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$(git rev-list -n 1 "${EXPECTED_TAG}")" != "${CHECKED_OUT_SHA}" ]]; then
            echo "${EXPECTED_TAG} does not point at checked-out commit ${CHECKED_OUT_SHA}" >&2
            exit 1
          fi
          PUBLISH_LATEST=false
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            if [[ "${RELEASE_PRERELEASE}" == "false" ]]; then
              PUBLISH_LATEST=true
            fi
          elif [[ "${UPDATE_LATEST}" == "true" ]]; then
            if [[ ! "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "latest requires a stable X.Y.Z package version" >&2
              exit 1
            fi
            PUBLISH_LATEST=true
          fi
          echo "tag=${EXPECTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "publish_latest=${PUBLISH_LATEST}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neapolitanicecream/recoleta
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
