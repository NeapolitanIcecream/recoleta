name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tagged version to publish, without the v prefix
        required: true
        type: string

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Verify the version and tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(uv version --short)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            EXPECTED_TAG="${RELEASE_TAG}"
          else
            EXPECTED_TAG="v${REQUESTED_VERSION}"
          fi
          if [[ "${EXPECTED_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Expected ${EXPECTED_TAG} to match package version v${PACKAGE_VERSION}" >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$(git rev-list -n 1 "${EXPECTED_TAG}")" != "${CHECKED_OUT_SHA}" ]]; then
            echo "${EXPECTED_TAG} does not point at checked-out commit ${CHECKED_OUT_SHA}" >&2
            exit 1
          fi
      - name: Verify index-compatible dependencies
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          direct = [value for value in project["dependencies"] if " @ " in value]
          if direct:
              raise SystemExit(
                  "PyPI release blocked by direct dependencies: " + ", ".join(direct)
              )
          PY
      - name: Build wheel and source distribution
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/recoleta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
