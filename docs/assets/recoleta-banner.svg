<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2400"
  height="1200"
  viewBox="0 0 2400 1200"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Recoleta research streams and publication</title>
  <desc id="description">
    Three equal research streams pass through source and evidence cards into
    three sections of one living publication.
  </desc>

  <defs>
    <style>
      .grid { fill: none; stroke: #e2e5ea; stroke-width: 2; }
      .route { fill: none; stroke: #145da0; stroke-width: 8; }
      .route-light { fill: none; stroke: #c8ced6; stroke-width: 4; }
      .card { fill: #f5f6f8; stroke: #172033; stroke-width: 4; }
      .page { fill: #ffffff; stroke: #172033; stroke-width: 4; }
      .rule { fill: none; stroke: #5f6875; stroke-width: 6; }
      .rule-light { fill: none; stroke: #c8ced6; stroke-width: 6; }
      .signal { fill: #145da0; }
      .signal-dark { fill: #0e477d; }
      .ink { fill: #172033; }
      .muted { fill: #5f6875; }
    </style>

    <g id="source-a">
      <rect class="card" width="168" height="176" />
      <circle class="signal" cx="84" cy="60" r="20" />
      <circle class="ink" cx="52" cy="112" r="10" />
      <circle class="ink" cx="84" cy="112" r="10" />
      <circle class="ink" cx="116" cy="112" r="10" />
      <path class="rule-light" d="M44 144H124" />
    </g>

    <g id="source-b">
      <rect class="card" width="168" height="176" />
      <path class="route-light" d="M36 70C52 42 68 98 84 70S116 42 132 70" />
      <path class="route-light" d="M36 108C52 80 68 136 84 108S116 80 132 108" />
      <circle class="ink" cx="84" cy="70" r="10" />
      <circle class="signal" cx="84" cy="108" r="10" />
    </g>

    <g id="source-c">
      <rect class="card" width="168" height="176" />
      <rect class="ink" x="40" y="104" width="20" height="32" />
      <rect class="muted" x="74" y="72" width="20" height="64" />
      <rect class="signal" x="108" y="44" width="20" height="92" />
      <path class="rule-light" d="M40 148H128" />
    </g>

    <g id="evidence-lines">
      <rect class="card" width="248" height="144" />
      <circle class="signal-dark" cx="40" cy="40" r="10" />
      <path class="rule" d="M68 40H196" />
      <path class="rule-light" d="M40 76H208M40 104H168" />
    </g>

    <g id="evidence-bars">
      <rect class="card" width="248" height="144" />
      <rect class="signal" x="40" y="76" width="24" height="32" />
      <rect class="signal" x="80" y="56" width="24" height="52" />
      <rect class="signal" x="120" y="36" width="24" height="72" />
      <rect class="signal" x="160" y="64" width="24" height="44" />
      <path class="rule-light" d="M40 116H208" />
    </g>

    <g id="evidence-points">
      <rect class="card" width="248" height="144" />
      <circle class="ink" cx="48" cy="48" r="8" />
      <circle class="signal" cx="88" cy="88" r="12" />
      <circle class="ink" cx="128" cy="56" r="8" />
      <circle class="signal-dark" cx="168" cy="96" r="10" />
      <circle class="signal" cx="200" cy="44" r="8" />
      <path class="route-light" d="M48 48L88 88L128 56L168 96L200 44" />
    </g>
  </defs>

  <rect width="2400" height="1200" fill="#ffffff" />
  <rect class="grid" x="96" y="96" width="2208" height="1008" />
  <path class="grid" d="M96 360H2304M96 600H2304M96 840H2304" />
  <path class="grid" d="M336 96V1104M672 96V1104M1008 96V1104M1344 96V1104M1680 96V1104" />

  <path class="route" d="M288 300H1792" />
  <path class="route" d="M288 600H1792" />
  <path class="route" d="M288 900H1792" />

  <use href="#source-a" x="120" y="212" />
  <use href="#source-b" x="120" y="512" />
  <use href="#source-c" x="120" y="812" />

  <use href="#evidence-lines" x="384" y="228" />
  <use href="#evidence-bars" x="720" y="228" />
  <use href="#evidence-points" x="1056" y="228" />

  <use href="#evidence-points" x="384" y="528" />
  <use href="#evidence-lines" x="720" y="528" />
  <use href="#evidence-bars" x="1056" y="528" />

  <use href="#evidence-bars" x="384" y="828" />
  <use href="#evidence-points" x="720" y="828" />
  <use href="#evidence-lines" x="1056" y="828" />

  <circle class="signal-dark" cx="1408" cy="300" r="18" />
  <circle class="signal-dark" cx="1408" cy="600" r="18" />
  <circle class="signal-dark" cx="1408" cy="900" r="18" />
  <path class="route-light" d="M1472 260V940" />
  <circle class="signal" cx="1472" cy="300" r="14" />
  <circle class="signal" cx="1472" cy="600" r="14" />
  <circle class="signal" cx="1472" cy="900" r="14" />

  <rect class="page" x="1832" y="160" width="448" height="880" />
  <rect class="page" x="1816" y="176" width="448" height="880" />
  <rect class="page" x="1800" y="192" width="448" height="880" />

  <rect class="ink" x="1848" y="240" width="224" height="16" />
  <rect class="muted" x="1848" y="272" width="144" height="10" />

  <rect class="grid" x="1848" y="332" width="352" height="200" />
  <circle class="signal-dark" cx="1880" cy="380" r="12" />
  <path class="rule" d="M1912 380H2128" />
  <path class="rule-light" d="M1880 428H2168M1880 468H2072" />

  <rect class="grid" x="1848" y="556" width="352" height="200" />
  <rect class="signal" x="1880" y="644" width="24" height="40" />
  <rect class="signal" x="1920" y="616" width="24" height="68" />
  <rect class="signal" x="1960" y="592" width="24" height="92" />
  <path class="rule-light" d="M1880 708H2168" />

  <rect class="grid" x="1848" y="780" width="352" height="200" />
  <circle class="ink" cx="1888" cy="844" r="10" />
  <circle class="signal" cx="1960" cy="900" r="14" />
  <circle class="signal-dark" cx="2040" cy="836" r="12" />
  <circle class="ink" cx="2144" cy="916" r="10" />
  <path class="route-light" d="M1888 844L1960 900L2040 836L2144 916" />

  <rect class="signal-dark" x="1784" y="284" width="32" height="32" />
  <rect class="signal-dark" x="1784" y="584" width="32" height="32" />
  <rect class="signal-dark" x="1784" y="884" width="32" height="32" />
</svg>
